name: Refresh official OFAC data
on:
  push:
    paths:
      - scripts/refresh-ofac.mjs
      - .github/workflows/refresh-ofac.yml
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: ofac-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/refresh-ofac.mjs
      - name: Save refreshed official data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ofac-sdn.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh official OFAC SDN snapshot'
          git push
